<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drakar och Demoner</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div id="minimap">
        <h4 id="minimap-name"></h4>
        <canvas id="minimap-canvas"></canvas>
      </div>
      <aside id="status"></aside>
      <div id="bottom">
        <div id="combat" hidden></div>
        <div id="log"></div>
      </div>
      <button id="btn-sheet" aria-label="Visa status">☰</button>
    </div>

    <section id="rollformular" hidden>
      <div class="rf-wrap">
        <button id="rf-close" aria-label="Stäng rollformuläret">✕</button>
        <div id="rf-content"></div>
      </div>
    </section>

    <section id="training" class="screen" hidden>
      <div class="card wide">
        <h1>Vila och träning</h1>
        <div id="training-body"></div>
        <button id="training-close" class="primary">Klar</button>
      </div>
    </section>

    <section id="dialog" hidden>
      <img id="dialog-portrait" alt="" />
      <div id="dialog-body">
        <header>
          <h2 id="dialog-name"></h2>
          <span id="dialog-mode"></span>
        </header>
        <div id="dialog-text"></div>
        <div id="dialog-options"></div>
        <form id="dialog-form">
          <input id="dialog-input" placeholder="Säg något eget…" maxlength="300" autocomplete="off" />
          <button>Säg</button>
        </form>
      </div>
    </section>

    <section id="start" class="screen">
      <div class="card wide">
        <h1>Drakar och Demoner</h1>
        <p class="sub">Ett soloäventyr i byn Gråvad</p>
        <button id="btn-continue" class="primary" hidden>Fortsätt äventyret</button>
        <h3>Ny rollperson</h3>
        <div id="creator"></div>
        <details>
          <summary>AI-inställningar</summary>
          <label>Åtkomstkod (om servern kräver en) <input id="in-code" type="password" autocomplete="off" /></label>
        </details>
      </div>
    </section>

    <section id="dead" class="screen" hidden>
      <div class="card">
        <h1>Du har stupat</h1>
        <p class="sub">Din saga slutar här – men en ny kan börja.</p>
        <button id="btn-restart" class="primary">Nytt äventyr</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
