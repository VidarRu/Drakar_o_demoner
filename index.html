<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drakar och Demoner</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link rel="stylesheet" href="/src/ui/book.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div id="minimap">
        <h4 id="minimap-name"></h4>
        <canvas id="minimap-canvas"></canvas>
      </div>
      <aside id="status"></aside>
      <div id="bottom">
        <div id="party" hidden></div>
        <div id="combat" hidden></div>
        <div id="log"></div>
      </div>
      <button id="btn-sheet" aria-label="Visa status">☰</button>
    </div>

    <section id="rollformular" hidden>
      <div class="rf-wrap">
        <button id="rf-close" aria-label="Stäng rollformuläret">✕</button>
        <div id="rf-content"></div>
      </div>
    </section>

    <section id="training" class="screen" hidden>
      <div class="card wide">
        <h1>Vila och träning</h1>
        <div id="training-body"></div>
        <button id="training-close" class="primary">Klar</button>
      </div>
    </section>

    <section id="panel" class="screen" hidden>
      <div class="card wide">
        <h1 id="panel-title"></h1>
        <div id="panel-body"></div>
        <button id="panel-close" class="primary">Stäng</button>
      </div>
    </section>

    <section id="dialog" hidden>
      <img id="dialog-portrait" alt="" />
      <div id="dialog-body">
        <header>
          <h2 id="dialog-name"></h2>
          <span id="dialog-mode"></span>
        </header>
        <div id="dialog-text"></div>
        <div id="dialog-options"></div>
        <form id="dialog-form">
          <input id="dialog-input" placeholder="Säg något eget…" maxlength="300" autocomplete="off" />
          <button>Säg</button>
        </form>
      </div>
    </section>

    <section id="menu"></section>

    <section id="modal" class="screen" hidden>
      <div class="card">
        <h1 id="modal-title"></h1>
        <div id="modal-body"></div>
        <div id="modal-buttons" class="modal-buttons"></div>
      </div>
    </section>

    <section id="between" class="screen" hidden>
      <div class="card wide">
        <h1>Mellan äventyren</h1>
        <div id="between-body"></div>
      </div>
    </section>

    <section id="dead" class="screen" hidden>
      <div class="card">
        <h1>Du har stupat</h1>
        <p class="sub">Din saga slutar här. Du kan ladda den senaste sparningen eller börja om med en ny rollperson.</p>
        <button id="btn-load-last" class="primary">Ladda senaste sparningen</button>
        <button id="btn-restart">Ny rollperson</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
